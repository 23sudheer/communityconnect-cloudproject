<!DOCTYPE html>
<html>
<head>
    <title>CommunityConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">CommunityConnect</span>

        <div>
            <a href="/events" class="btn btn-light">Events</a>
            <a href="/login" class="btn btn-light">Login</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card p-4 mb-4">
        <h2>Charlotte Weather</h2>

        <button class="btn btn-primary" onclick="loadWeather()">
            Load Weather
        </button>

        <div id="weather-result" class="mt-3"></div>
    </div>

    <div class="card p-4 mb-4">
        <h2>Create Community Post</h2>

        <form id="postForm" enctype="multipart/form-data">

            <input
                type="text"
                class="form-control mb-3"
                id="title"
                placeholder="Post Title"
                required
            >

            <textarea
                class="form-control mb-3"
                id="content"
                placeholder="Write something..."
                required
            ></textarea>

            <input
                type="file"
                class="form-control mb-3"
                id="image"
            >

            <button type="submit" class="btn btn-success">
                Create Post
            </button>

        </form>
    </div>

    <div id="postsContainer"></div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
