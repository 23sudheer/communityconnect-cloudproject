<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card p-4">

        <h2>{{ mode.title() }}</h2>

        <form method="POST">

            {% if mode == 'register' %}
            <input
                type="text"
                class="form-control mb-3"
                name="name"
                placeholder="Name"
                required
            >
            {% endif %}

            <input
                type="email"
                class="form-control mb-3"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                class="form-control mb-3"
                name="password"
                placeholder="Password"
                required
            >

            <button class="btn btn-primary">
                {{ mode.title() }}
            </button>

        </form>

    </div>

</div>

</body>
</html>
